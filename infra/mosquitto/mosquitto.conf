# Eclipse Mosquitto configuration for the Monitoring MQTT local lab.
#
# SECURITY: anonymous access is enabled because the broker is meant for an
# isolated local environment only. The Compose file publishes the port on the
# host loopback interface (127.0.0.1). Never expose this configuration to other
# networks; use authentication, TLS and ACLs instead.

# MQTT over TCP, reachable by other containers on the Compose network.
listener 1883 0.0.0.0
allow_anonymous true

# Sessions live in memory only (lost when the broker restarts).
persistence false

# Experiments may use persistent sessions (clean_session: false). Their client ids embed the
# container id, so a recreated container leaves its old session behind; expire such
# sessions after one hour of disconnection so they do not accumulate. While a session is
# kept, the broker queues at most `max_queued_messages` (default 1000) QoS 1 messages.
persistent_client_expiration 1h

# Log to stdout so `docker compose logs` shows broker activity.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
