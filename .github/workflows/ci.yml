name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10" # same uv as the Dev Container image
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Unit tests
        run: uv run --frozen pytest tests/unit

  integration:
    name: Integration tests (Docker)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep the isolated stack after the tests, so its logs can be collected on failure.
      IT_KEEP_STACK: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Integration tests
        run: uv run --frozen monitoring-mqtt test integration -v

      - name: Collect stack logs
        if: failure()
        run: docker compose --project-name monitoring-mqtt-it --file compose.yaml logs --timestamps > integration-logs.txt 2>&1 || true

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration-logs.txt
