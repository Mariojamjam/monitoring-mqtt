name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10" # same uv as the Dev Container image
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Unit tests
        run: uv run --frozen pytest tests/unit

      # The images also run on Raspberry Pis (64-bit ARM): every locked dependency of both
      # images must exist as a prebuilt arm64 package. Fast; the next job builds them.
      - name: Dependencies available for arm64
        run: |
          for group in "" "--group dashboard"; do
            uv export --frozen --no-default-groups $group --no-emit-project --no-hashes > req.txt
            uv pip install --dry-run --python-platform aarch64-unknown-linux-gnu \
              --python-version 3.12 --only-binary :all: --target /tmp/arm64 -r req.txt
          done

  arm64-images:
    name: Images build for arm64 (Raspberry Pi)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build the app, dashboard and broker images for linux/arm64
        run: |
          docker buildx build --platform linux/arm64 --target app \
            --cache-from type=gha,scope=app-arm64 --cache-to type=gha,mode=max,scope=app-arm64 .
          docker buildx build --platform linux/arm64 --target dashboard \
            --cache-from type=gha,scope=dashboard-arm64 \
            --cache-to type=gha,mode=max,scope=dashboard-arm64 .
          docker buildx build --platform linux/arm64 infra/mosquitto

  integration:
    name: Integration tests (Docker)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep the isolated stack after the tests, so its logs can be collected on failure.
      IT_KEEP_STACK: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Integration tests
        run: uv run --frozen monitoring-mqtt test integration -v

      - name: Collect stack logs
        if: failure()
        run: docker compose --project-name monitoring-mqtt-it --file compose.yaml logs --timestamps > integration-logs.txt 2>&1 || true

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration-logs.txt
