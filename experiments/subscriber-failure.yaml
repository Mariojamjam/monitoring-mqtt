# A monitor stops for 20 s. Publishers do not notice. With a clean session it misses what
# was published meanwhile; with a persistent session the broker queues it.
schema_version: 1
name: subscriber-failure
description: Monitor stopped for 20 s, clean versus persistent sessions
warmup: 30s
duration: 150s
repetitions: 3
set:
  run.log_level: WARNING
  devices.publish_interval_seconds: 1
  workers.dissolved_oxygen_probe.replicas: 0
  workers.rumen_ph_bolus.replicas: 0
  workers.ammonia_detector: {replicas: 2, devices_per_worker: 5}
  monitors: {aquaculture: {replicas: 0}, poultry: {replicas: 1}, cattle: {replicas: 0}}
sweep:
  mqtt.clean_session: [true, false]
actions:
  - {at: 60s, do: stop, service: monitor-poultry, for: 20s}
observe_telemetry: true
report:
  charts: [delivery, throughput, duplicates]
