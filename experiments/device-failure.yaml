# One device fails 70 s after its worker starts (inside the window): a clean stop sends
# nothing meanwhile (no gap), a disconnection loses what it generates (sequence gaps).
schema_version: 1
name: device-failure
description: One device stopped versus disconnected for 30 s
warmup: 30s
duration: 2m
repetitions: 3
observe_telemetry: true
set:
  run.log_level: WARNING
  devices.publish_interval_seconds: 1
  workers.dissolved_oxygen_probe.replicas: 0
  workers.rumen_ph_bolus.replicas: 0
  workers.ammonia_detector: {replicas: 2, devices_per_worker: 5}
  monitors: {aquaculture: {replicas: 0}, poultry: {replicas: 1}, cattle: {replicas: 0}}
sweep:
  behavior.faults:
    - [{device: "poultry-*-001", at: 70s, lasts: 30s, action: stop}]
    - [{device: "poultry-*-001", at: 70s, lasts: 30s, action: disconnect}]
report:
  charts: [gaps, delivery, throughput]
