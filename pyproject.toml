[project]
name = "monitoring-mqtt"
version = "0.2.0"
description = "Publish/Subscribe lab simulating chemical-monitoring IoT devices over MQTT."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paho-mqtt>=2.2.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.scripts]
monitoring-mqtt = "monitoring_mqtt.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitoring_mqtt"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The host bootstrap must run on older system Pythons.
per-file-target-version = { "scripts/bootstrap.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
