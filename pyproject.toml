[project]
name = "monitoring-mqtt"
version = "0.3.0"
description = "Publish/Subscribe lab simulating chemical-monitoring IoT devices over MQTT."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "paho-mqtt>=2.2.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.8",
    "textual>=8.2.8",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
monitoring-mqtt = "monitoring_mqtt.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitoring_mqtt"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The host bootstrap must run on older system Pythons.
per-file-target-version = { "scripts/bootstrap.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
# `pytest` alone runs the unit tests; the integration suite needs Docker and is run with
# `monitoring-mqtt test integration` (or `pytest tests/integration`).
testpaths = ["tests/unit"]
addopts = "-ra"
markers = ["integration: needs Docker; starts an isolated stack (monitoring-mqtt-it)"]
# Starlette recommends httpx2 for its test client; httpx is what the project uses.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
